[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "canopy"
version = "0.1.0"
description = "Greenhouse automation, monitoring and Claude-based assistant for the Canopy GH-1 controller"
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.9", "PyYAML>=6", "anthropic>=0.40"]

[project.optional-dependencies]
board = ["smbus2>=0.4", "gpiod>=2.1", "spidev>=3.6", "paho-mqtt>=2.0", "pyserial>=3.5"]
voice = ["faster-whisper>=1.0", "openwakeword>=0.6", "sounddevice>=0.4", "numpy"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-aiohttp>=1.1", "tzdata; sys_platform == 'win32'"]

[project.scripts]
canopy = "canopy.__main__:main"

[tool.setuptools.packages.find]
include = ["canopy*"]
[tool.setuptools.package-data]
canopy = ["web/*.html"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
